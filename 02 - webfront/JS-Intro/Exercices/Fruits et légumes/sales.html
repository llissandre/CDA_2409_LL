<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales de fruits et légumes</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <div id="app">
        <header>
            <div id="image"></div>
            <nav>
                <div id="vente">
                    <ul>
                        <li>ventes</li>
                        <li><a href="newSale.html">nouvelle vente</a></li>
                    </ul>
                </div>
                <div id="légume">
                    <ul>
                        <li><a href="index.html">légumes</a></li>
                        <li><a href="newVegetable.html">nouveau légume</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <h1>Liste des ventes</h1>
            <div class="button-container">
                <button @click="resetSaveSales">Supprimer les données sauvegardées</button>
                <button @click="downloadJSONSales">Télécharger le fichier json</button>
            </div>
            <div id="ventes">
                <div v-for="sale of collectionSales">
                    <h2>{{ sale. Name }} {{ sale.Variety}}</h2>
                    <h2>({{sale.SaleWeight}}KG)</h2>
                    <p>
                        {{ getFrenchDate(sale.SaleDate) }}
                    </p>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy; Coopérative bio - 2025</p>
        </footer>
    </div>
</body>

</html>
