<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales de fruits et légumes</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <div id="app">
        <header>
            <div id="image"></div>
            <nav>
                <div id="vente">
                    <ul>
                        <li>ventes</li>
                        <li>nouvelle vente</li>
                    </ul>
                </div>
                <div id="légume">
                    <ul>
                        <li>légumes</li>
                        <li>nouveau légume</li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <h1>Liste des ventes</h1>
            <div id="ventes">
                <div v-for="sale of collectionSales" :key="sale.Id" class="ventes">
                    <h2>{{  sale. Name }} {{ sale.Variety}}</h2>
                    <h2>({{sale.SaleWeight}}KG)</h2>
                    <p>
                        {{ getFrenchDate(sale.SaleDate) }}
                    </p>
                </div>
               
            </div>
        </main>
        <footer></footer>
    </div>
</body>

</html>
