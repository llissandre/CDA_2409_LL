<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle vente de fruits et légumes</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <div id="app">
        <header>
            <div id="image"></div>
        </header>
        <main>
            <div id="newSale">
                <form action="">
                    <fieldset>
                        <legend>Nouvelle vente</legend>
                        <div>
                            <label for="date">Date de vente</label>
                            <input type="date" id="date" required>
                        </div>
                        <div>
                            <label for="saleWeight">Poids</label>
                            <input type="text" id="saleWeight" required>
                        </div>
                        <div>
                            <label for="unitPrice">Prix</label>
                            <input type="text" id="unitPrice" required>
                        </div>
                        <div id="saleActiveDiv">
                            <label for="saleActive">Est-ce frais ?</label>
                            <select v-model="saleActive" id="saleActive" required>
                                <option :value="1">Oui</option>
                                <option :value="0">Non</option>
                            </select>
                        </div>
                        <div>
                            <label for="vegetableId">Identifiant du légume</label>
                            <input type="text" id="vegetableId" required>
                        </div>
                        <div>
                            <label for="name">Nom</label>
                            <input type="text" id="name" required>
                        </div>
                        <div>
                            <label for="variety">Variété</label>
                            <input type="text" id="variety" required>
                        </div>
                        <div>
                            <label for=""></label>
                            <input type="submit" value="Valider">
                        </div>
                    </fieldset>
                </form>
            </div>
        </main>
        <footer></footer>
    </div>
</body>

</html>
