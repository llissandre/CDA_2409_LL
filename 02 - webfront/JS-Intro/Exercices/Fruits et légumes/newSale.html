<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle vente de fruits et légumes</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <div id="app">
        <header>
            <div id="image"></div>
        </header>
        <main>
           <div id="newSale">
            <form action="">
                <fieldset>
                    <legend>Nouvelle vente</legend>
                <div>
                    <label for="date">Date de vente</label>
                    <input type="text" id="date">
                </div>
                <div>
                    <label for="saleWeight">Poids</label>
                    <input type="text" id="saleWeight">
                </div>
                <div>
                    <label for="unitPrice">Prix</label>
                    <input type="text" id="unitPrice">
                </div>
                <div>
                    <label for="saleActive">Vente active</label>
                    <input type="text" id="saleActive">
                </div>
                <div>
                    <label for="vegetableId">Identifiant du légume</label>
                    <input type="text" id="vegetableId">
                </div>
                <div>
                    <label for="name">Nom</label>
                    <input type="text" id="name">
                </div>
                <div>
                    <label for="variety">Variété</label>
                    <input type="text" id="variety">
                </div>
                <div>
                    <label for=""></label>
                   <input type="submit" value="Valider">
                </div>
                </fieldset>
            </form>
           </div>
        </main>
        <footer></footer>
    </div>
</body>

</html>
