<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index de fruits et légumes</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <div id="app">
        <header>
            <div id="image"></div>
            <nav>
                <div id="vente">
                    <ul>
                        <li>ventes</li>
                        <li>nouvelle vente</li>
                    </ul>
                </div>
                <div id="légume">
                    <ul>
                        <li>légumes</li>
                        <li>nouveau légume</li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <h1>Liste des légumes</h1>
            <div id="legumes">
                <table id="myTable">
                    <thead>
                        <tr>
                            <th data-sort="name" @click="sortTable(th.dataset.sort)">nom<span class="arrow" id="arrow-name"></span></th>
                            <th data-sort="variety" @click="sortTable(th.dataset.sort)">variété<span class="arrow" id="arrow-variety"></span></th>
                            <th data-sort="color" @click="sortTable(th.dataset.sort)">couleur<span class="arrow" id="arrow-color"></span></th>
                            <th data-sort="lifeTime" @click="sortTable(th.dataset.sort)">durée de conservation<span class="arrow" id="arrow-lifeTime"></span></th>
                            <th data-sort="fresh" @click="sortTable(th.dataset.sort)">frais<span class="arrow" id="arrow-fresh"></span></th>
                            <th>actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="vege of collectionVegetables" :key="vege.Fresh">
                            <td>{{vege.Name}}</td>
                            <td>{{vege.Variety}}</td>
                            <td>{{vege.PrimaryColor}}</td>
                            <td>{{vege.LifeTime}}</td>
                            <td>{{setStatusFresh(vege.Fresh)}}</td>
                            <td>editer . supprimer</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <footer></footer>
    </div>
</body>

</html>
