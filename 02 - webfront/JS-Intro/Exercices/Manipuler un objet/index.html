<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipuler un objet</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/index.js" async></script>
</head>

<body>
    <main>
        <div id="filet">
            <h1>Profil de John Doe</h1>
            <div id="tableau">
                <table id="myTable"></table>
            </div>
            <form action="" id="form">
                <div>
                    <legend>Modifier le profil</legend>
                </div>
                <div id="informations">
                    <div>
                        <label for="firstname">Prénom :</label>
                    </div>
                    <div>
                        <input type="text" name="" id="firstname">
                    </div>
                    <div>
                        <label for="lastname">Nom : </label>
                    </div>
                    <div>
                        <input type="text" name="" id="lastname">
                    </div>
                    <div>
                        <label for="birthday">Date de naissance : </label>
                    </div>
                    <div>
                        <input type="text" name="" id="birthday">
                    </div>
                    <div>
                        <label for="salary">Salaire :</label>
                    </div>
                    <div>
                        <input type="text" name="" id="salary">
                    </div>
                    <div></div>
                    <div>
                        <input type="submit" id="btnEnregistrer" value="Enregistrer">
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
