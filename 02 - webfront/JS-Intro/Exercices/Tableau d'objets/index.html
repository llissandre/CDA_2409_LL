<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau d'objets</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/index.js" defer></script>
</head>

<body>
    <main>
        <div id="filet">
            <div id="divForm">
                <div id="mepEntete">
                    <h1>Espace membres</h1>
                    <div id="mdpIncorrect">Identifiant ou mot de passe incorrect</div>
                </div>
                <form action="" id="form">
                    <div>
                        <legend>Identification</legend>
                    </div>
                    <div id="informations">
                        <div>
                            <label for="identifiantInput">Identifiant:</label>
                        </div>
                        <div>
                            <input type="text" name="" id="identifiantInput">
                        </div>
                        <div>
                            <label for="passwordInput">Mot de passe: </label>
                        </div>
                        <div>
                            <input type="password" name="" id="passwordInput">
                        </div>
                    </div>
                    <input type="submit" id="btnConnexion" value="Connexion">
                </form>
            </div>
            <div id="divTabId">
                <div id="bonjour">
                    <p>Bonjour <span></span></p>
                    <input type="button" id="btnDeconnexion" value="Déconnexion">
                </div>
                <table id="myTable"></table>
            </div>
        </div>
    </main>
</body>

</html>
