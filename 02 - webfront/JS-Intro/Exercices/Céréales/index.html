<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Céréales</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/index.js" type="module"></script>
</head>

<body>
    <header>
        <nav>
            <div id="titleHeader">
                <h1>Cereals</h1>
            </div>
            <div id="inputsHeader">
                <fieldset class="fieldsetSC">
                    <legend>Rechercher</legend>
                    <input type="search" name="searchCereal" id="inputSearchCereal" placeholder="Nom de la céréale">
                </fieldset>
                <fieldset class="fieldsetF">
                    <legend>Filtrer</legend>
                    <fieldset class="ns">
                        <legend>Nutriscore</legend>
                        <label for="a">A</label>
                        <input type="checkbox" name="checkboxNS" class="checkboxNS" value="A" id="a">
                        <label for="b">B</label>
                        <input type="checkbox" name="checkboxNS" class="checkboxNS" value="B" id="b">
                        <label for="c">C</label>
                        <input type="checkbox" name="checkboxNS" class="checkboxNS" value="C" id="c">
                        <label for="d">D</label>
                        <input type="checkbox" name="checkboxNS" class="checkboxNS" value="D" id="d">
                        <label for="e">E</label>
                        <input type="checkbox" name="checkboxNS" class="checkboxNS" value="E" id="e">
                    </fieldset>
                    <fieldset class="category">
                        <legend>Catégorie</legend>
                        <select class="ctgr" name="ctgr" id="ctgr">
                            <option value="all" id="all" selected>Tous</option>
                            <option value="withoutSugar" id="withoutSugar">Sans sucre</option>
                            <option value="lowSalt" id="lowSalt">lowSalt</option>
                            <option value="boost" id="boost">Boost</option>
                        </select>
                    </fieldset>
                </fieldset>
        </nav>
    </header>
    <main>
        <table id="myTable">
            <thead>
                <tr>
                    <th>id</th>
                    <th>nom</th>
                    <th>calories</th>
                    <th>protéïnes</th>
                    <th>sel</th>
                    <th>fibres</th>
                    <th>glucides</th>
                    <th>sucre</th>
                    <th>potassium</th>
                    <th>vitamines</th>
                    <th>évaluation</th>
                    <th>ns</th>
                    <th>dell</th>
                </tr>
            </thead>

        </table>
    </main>
    <footer></footer>
</body>

</html>
