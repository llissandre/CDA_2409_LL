<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codes postaux</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/index.js" defer></script>
</head>

<body>
    <div>
        <form action="">
            <h1>Recherche de Ville</h1>
            <label for="searchInput">Saisir un code postal : </label>
            <input type="search" id="searchInput" list="listeVilles" placeholder="Entrez un code postal">
            <datalist id="listeVilles"></datalist>
            <input type="submit" value="Valider" id="btnValider"></input>
            <button onclick="rechercherVille()">Rechercher</button>
        </form>

        <div id="informations"></div>
    </div>
</body>

</html>
